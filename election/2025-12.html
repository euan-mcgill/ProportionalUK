<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>December 2025 Poll | ProportionalUK</title>
<meta name="description" content="Proportional representation results for December 2025 Poll">
<style>
:root {
  --bg: #e8f5e9;
  --card: #ffffff;
  --accent: #2e7d32;
  --text: #1b2a1e;
  --muted: #5f6f62;
  --gutter: 8px;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px var(--gutter);
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(46, 125, 50, 0.15);
}
header h1 {
  margin: 0;
  font-size: clamp(1.2rem, 2.5vw, 1.8rem);
  font-weight: 700;
}
nav { display: flex; flex-wrap: wrap; gap: 8px; }
nav a {
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  transition: background 0.15s, color 0.15s;
}
nav a:hover, nav a:focus-visible {
  background: var(--accent);
  color: #fff;
}
main {
  display: flex;
  gap: var(--gutter);
  padding: var(--gutter);
}
.map-col {
  flex: 0 0 58%;
  display: flex;
  flex-direction: column;
  gap: var(--gutter);
}
.side-col {
  flex: 1 1 42%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gutter);
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
}
.map-col object, .map-col img {
  display: block;
  width: 100%;
  height: auto;
}
.charts .flourish-embed { margin-bottom: 12px; }
.charts .flourish-embed:last-child { margin-bottom: 0; }
.notes h2 { margin-top: 0; font-size: 1.2rem; }
.notes p { color: var(--muted); }
@media (max-width: 900px) {
  main { flex-direction: column; }
  .map-col { flex-basis: auto; }
}
</style>
</head>
<body>
<header>
  <h1>December 2025 Poll</h1>
  <nav>
    <a href="../index.html">All elections</a>
    <a href="../about.html">About</a>
    <a href="../compare.html">Compare</a>
  </nav>
</header>

<main>
  <section class="map-col" aria-label="Election maps">
    <div class="card">
      <object type="image/svg+xml" data="../election_maps/2025-12_District.svg" aria-label="Map of December 2025 results by district">
        <img src="../election_maps/2025-12_District.svg" alt="Map of December 2025 results by district">
      </object>
      <p>Election map is zoomable on this page, but it can also be expanded in a <a href="../election_maps/2025-12_District.svg" target="_blank" rel="noopener noreferrer">new tab</a></p>
    </div>
  </section>

  <aside class="side-col">
    <section class="card notes">
      <h2>Overview</h2>
      <p>Overview of the December 2025 results goes here.</p>
    </section>
    <section class="card charts" aria-label="Results charts">
      <div class="flourish-embed flourish-parliament" data-src="visualisation/26997014"><noscript><img src="https://public.flourish.studio/visualisation/26997014/thumbnail" width="100%" alt="parliament visualization" /></noscript></div>
    </section>
    <section class="card notes">
      <h2>Notes</h2>
      <p>Commentary on the December 2025 results goes here.</p>
    </section>
  </aside>
</main>

<script src="https://public.flourish.studio/resources/embed.js"></script>
<footer style="padding: 16px 8px; color: #5f6f62; font-size: 0.875rem; text-align: center;">
  &copy; Euan McGill 2026. All rights reserved.
</footer>
</body>
</html>
